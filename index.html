<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牙e通客戶成功培訓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <div class="scrim" id="scrim" hidden></div>

  <section class="login" id="login" hidden>
    <div class="login-deco" aria-hidden="true">
      <span class="deco-aurora is-one"></span>
      <span class="deco-aurora is-two"></span>
      <span class="deco-aurora is-three"></span>
      <svg class="deco-wave is-back" viewBox="0 0 1440 160" preserveAspectRatio="none"><path d="M0 80C120 40 240 40 360 80S600 120 720 80 960 40 1080 80 1320 120 1440 80V160H0Z"/></svg>
      <svg class="deco-wave is-front" viewBox="0 0 1440 160" preserveAspectRatio="none"><path d="M0 100C120 60 240 60 360 100S600 140 720 100 960 60 1080 100 1320 140 1440 100V160H0Z"/></svg>
    </div>
    <div class="login-shell glass" id="loginShell">
      <div class="login-panel">
        <div class="login-brand">台灣牙e通</div>
        <p class="mascot-bubble" id="mascotBubble" aria-hidden="true"></p>
        <div class="mascot-stage" aria-hidden="true">
          <span class="mascot-badge is-left">健保怎麼申報</span>
          <span class="mascot-badge is-right">系統怎麼操作</span>
          <svg class="mascot" id="mascot" data-mood="idle" viewBox="0 0 360 230"></svg>
        </div>
        <p class="login-panel-title">一起把服務做得更好！</p>
      </div>
      <form class="login-card" id="loginForm" novalidate>
        <img class="login-logo" src="logo.png" alt="dentall 牙e通 logo">
        <h1 class="login-title">客戶成功部<br>內部培訓</h1>
        <p class="login-hint" id="loginHint">請登入後開始學習</p>
        <label class="login-field">
          <span>帳號</span>
          <span class="login-input">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-7 8-7s7 2.5 8 7"/></svg>
            <input id="loginAccount" name="account" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
          </span>
        </label>
        <label class="login-field">
          <span>密碼</span>
          <span class="login-input">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password">
          </span>
        </label>
        <p class="login-error" id="loginError" role="alert"></p>
        <button class="button login-submit" id="loginSubmit" type="submit">登入</button>
        <button class="login-mentor" id="loginAsMentor" type="button" hidden>以指導者身分進入</button>
        <p class="login-help">帳號或密碼有問題，請洽管理者。</p>
      </form>
    </div>
  </section>

  <div class="layout" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand sidebar-brand" href="#/">
        <img class="brand-mark" src="logo.png" alt="">
        客戶成功培訓
      </a>
      <nav id="sidebarNav" aria-label="教育訓練大綱"></nav>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button class="menu-button" id="menuButton" type="button" aria-label="開啟大綱" aria-expanded="false" aria-controls="sidebar">
          <span></span><span></span><span></span>
        </button>
        <a class="brand topbar-brand" href="#/" aria-label="牙e通客戶成功培訓">
          <img class="brand-mark" src="logo.png" alt="">
          <span class="brand-text">牙e通客戶成功培訓</span>
        </a>
        <div class="topbar-heading">
          <p class="topbar-title" id="topbarTitle"></p>
          <p class="topbar-date" id="topbarDate"></p>
        </div>
        <div class="search" id="search" role="search">
          <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜尋關鍵字" aria-label="搜尋網站內容" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list" autocomplete="off">
          <ul class="search-results" id="searchResults" role="listbox" aria-label="搜尋結果" hidden></ul>
        </div>
        <button class="search-toggle" id="searchToggle" type="button" aria-label="開啟搜尋" aria-expanded="false" aria-controls="search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
        </button>
        <div class="notify" id="notify" hidden>
          <button class="notify-button" id="notifyButton" type="button" aria-label="指導者留言通知" aria-expanded="false" aria-controls="notifyPanel">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span class="notify-badge" id="notifyBadge" hidden></span>
          </button>
          <div class="notify-panel" id="notifyPanel" hidden></div>
        </div>
        <div class="topbar-account">
          <span class="topbar-account-name" id="topbarAccountName"></span>
          <button class="topbar-logout" id="logoutButton" type="button">登出</button>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
